<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUT ke-40 PRAMYOSMAR - Reuni Akbar & Undangan Alumni</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #070505;
            color: #f1f5f9;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .glass-card {
            background: rgba(20, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glow-red-yellow {
            box-shadow: 0 0 25px rgba(225, 29, 72, 0.15), 0 0 50px rgba(245, 158, 11, 0.1);
        }
        .text-gradient {
            background: linear-gradient(135deg, #fb7185 0%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-mesh {
            background-image: 
                radial-gradient(at 10% 20%, rgba(225, 29, 72, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(245, 158, 11, 0.15) 0px, transparent 50%);
        }
        @keyframes pulse-wa {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .wa-float {
            animation: pulse-wa 2s infinite;
        }
    </style>
</head>
<body class="bg-mesh p-4 selection:bg-red-600 selection:text-white">

    <!-- HEADER / APP BAR (LOGO DIPERBESAR & JUDUL AGAK DI BAWAH) -->
    <header class="text-center space-y-2 pt-3">
        <div class="inline-block p-2 rounded-2xl bg-gradient-to-br from-red-600/30 to-amber-500/30 shadow-xl">
            <img src="1000568995.jpg" alt="Logo PRAMYOSMAR" class="w-16 h-16 sm:w-20 sm:h-20 mx-auto object-cover rounded-xl">
        </div>
        <div class="space-y-0.5">
            <h1 class="text-lg sm:text-2xl font-extrabold tracking-tight text-white leading-tight">
                PRAMYOSMAR <span class="text-gradient">40 TAHUN</span>
            </h1>
            <p class="text-[11px] sm:text-xs font-medium text-slate-300 italic px-2">
                "Menjemput Jejak Langkah, Menyalakan Kembali Api Ambalan"
            </p>
        </div>
    </header>

    <!-- MAIN APP CONTENT -->
    <main class="w-full max-w-md mx-auto space-y-3 my-auto">

        <!-- KARTU INFO & DOWNLOAD -->
        <div class="glass-card p-3.5 rounded-2xl glow-red-yellow">
            <div class="flex items-center justify-between gap-2 bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-xs text-left">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg bg-red-500/10 flex items-center justify-center text-red-400 flex-shrink-0 text-sm">
                        <i class="fa-regular fa-calendar"></i>
                    </div>
                    <div>
                        <p class="text-[9px] text-slate-400 uppercase font-semibold">Waktu & Lokasi</p>
                        <p class="font-bold text-slate-200 text-xs">12 Des 2026 • SMK KAL 1 Sby</p>
                    </div>
                </div>
                <a href="https://drive.google.com/drive/folders/1X_o-rVsGUQITc5AOx_BZz351IHRrXUKq" target="_blank" class="bg-gradient-to-r from-red-600 to-amber-500 hover:from-red-500 hover:to-amber-400 text-white font-semibold text-[11px] px-3 py-2 rounded-xl transition shadow-md flex items-center gap-1.5 flex-shrink-0">
                    <i class="fa-solid fa-folder-open"></i> Unduhan
                </a>
            </div>
        </div>

        <!-- MENU NAVIGASI APLIKASI (GRID 2x2 SIMETRIS) -->
        <div class="grid grid-cols-2 gap-2.5">
            <!-- Menu Registrasi -->
            <a href="reg.html" class="glass-card hover:bg-slate-900/90 p-3.5 rounded-2xl text-center space-y-2 transition duration-300 group border border-slate-700/50 hover:border-amber-500/50 flex flex-col items-center justify-center">
                <div class="w-10 h-10 bg-red-600/20 text-red-400 rounded-xl flex items-center justify-center text-base group-hover:scale-110 transition">
                    <i class="fa-solid fa-clipboard-user"></i>
                </div>
                <h3 class="font-bold text-white text-xs tracking-wide">Registrasi</h3>
            </a>

            <!-- Menu Merchandise -->
            <a href="merch.html" class="glass-card hover:bg-slate-900/90 p-3.5 rounded-2xl text-center space-y-2 transition duration-300 group border border-slate-700/50 hover:border-amber-500/50 flex flex-col items-center justify-center">
                <div class="w-10 h-10 bg-amber-500/20 text-amber-400 rounded-xl flex items-center justify-center text-base group-hover:scale-110 transition">
                    <i class="fa-solid fa-store"></i>
                </div>
                <h3 class="font-bold text-white text-xs tracking-wide">Merchandise</h3>
            </a>

            <!-- Menu Ucapan -->
            <a href="ucapan.html" class="glass-card hover:bg-slate-900/90 p-3.5 rounded-2xl text-center space-y-2 transition duration-300 group border border-slate-700/50 hover:border-amber-500/50 flex flex-col items-center justify-center">
                <div class="w-10 h-10 bg-emerald-500/20 text-emerald-400 rounded-xl flex items-center justify-center text-base group-hover:scale-110 transition">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <h3 class="font-bold text-white text-xs tracking-wide">Buku Ucapan</h3>
            </a>

            <!-- Menu Kenangan -->
            <a href="kenangan.html" class="glass-card hover:bg-slate-900/90 p-3.5 rounded-2xl text-center space-y-2 transition duration-300 group border border-slate-700/50 hover:border-amber-500/50 flex flex-col items-center justify-center">
                <div class="w-10 h-10 bg-blue-500/20 text-blue-400 rounded-xl flex items-center justify-center text-base group-hover:scale-110 transition">
                    <i class="fa-solid fa-photo-film"></i>
                </div>
                <h3 class="font-bold text-white text-xs tracking-wide">Kenangan</h3>
            </a>
        </div>

    </main>

    <!-- FLOATING WHATSAPP WIDGET -->
    <div class="fixed bottom-16 right-4 z-50">
        <div id="waPopup" class="hidden absolute bottom-14 right-0 bg-slate-900 border border-slate-700 p-3.5 rounded-2xl shadow-2xl w-56 space-y-2.5 text-xs">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="font-bold text-white flex items-center gap-1.5"><i class="fa-brands fa-whatsapp text-emerald-400"></i> Narahubung</span>
                <button onclick="toggleWaPopup()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-1.5">
                <a href="https://wa.me/6281228323895" target="_blank" class="flex items-center justify-between bg-slate-800 hover:bg-slate-700 p-2 rounded-xl transition text-white">
                    <span class="font-semibold text-xs">Kak Rafa</span>
                    <i class="fa-brands fa-whatsapp text-emerald-400"></i>
                </a>
                <a href="https://wa.me/6288991821000" target="_blank" class="flex items-center justify-between bg-slate-800 hover:bg-slate-700 p-2 rounded-xl transition text-white">
                    <span class="font-semibold text-xs">Kak Cevin</span>
                    <i class="fa-brands fa-whatsapp text-emerald-400"></i>
                </a>
            </div>
        </div>

        <button onclick="toggleWaPopup()" class="w-12 h-12 bg-emerald-600 hover:bg-emerald-500 text-white rounded-full flex items-center justify-center text-xl shadow-2xl transition duration-300 wa-float cursor-pointer">
            <i class="fa-brands fa-whatsapp"></i>
        </button>
    </div>

    <!-- FOOTER / APP NAVIGATION BAR BAWAH -->
    <footer class="text-center py-2 text-[10px] text-slate-500 border-t border-white/5 bg-slate-950/60 flex items-center justify-between px-4">
        <span>Ambalan PRAMYOSMAR • SMK KAL 1 Sby</span>
        <a href="admin.html" class="text-amber-500/80 hover:text-amber-400 bg-slate-900 px-2 py-1 rounded border border-slate-800">
            <i class="fa-solid fa-lock text-[9px]"></i> Admin
        </a>
    </footer>

    <!-- SCRIPT FLOATING WA -->
    <script>
        function toggleWaPopup() {
            const popup = document.getElementById('waPopup');
            popup.classList.toggle('hidden');
        }
    </script>
</body>
</html>
